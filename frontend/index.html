<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>waterboy</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* The window scrolls its two panes, not the page. */
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
  #app .cols { min-height: 0; }
  aside, #scroll { overflow-y: auto; }
  #app > .settings-page { overflow-y: auto; }
  .savebar { position: sticky; }
</style>
<script type="module">
  import { Call, Events, Browser } from "/wails/runtime.js";

  const call = (m, ...a) => Call.ByName("main.UI." + m, ...a);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  const zero = t => !t || t.startsWith("0001");
  // rel and ago match the web dashboard's: "2 min ago", exact time on hover, kept current below.
  const rel = (t) => {
    const s = Math.round((Date.now() - new Date(t)) / 1000), a = Math.abs(s);
    const v = a < 60 ? "" : a < 3600 ? `${Math.round(a / 60)} min` : a < 86400 ? `${Math.round(a / 3600)} h` : `${Math.round(a / 86400)} d`;
    return !v ? (s < 0 ? "in a moment" : "just now") : s < 0 ? `in ${v}` : `${v} ago`;
  };
  const ago = t => zero(t) ? "never" : `<time data-rel datetime="${esc(t)}" title="${esc(new Date(t).toLocaleString())}">${rel(t)}</time>`;
  setInterval(() => document.querySelectorAll("time[data-rel]").forEach(el => el.textContent = rel(el.dateTime)), 30000);
  const stamp = t => new Date(t).toLocaleString([], {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
  const short = sha => esc((sha ?? "").slice(0, 8));
  const base = repo => esc(repo.split("/").pop());
  const REASONS = {new: "PR first seen", commits: "new commits", replies: "new replies", manual: "run by you"};
  const reason = r => esc(REASONS[r] ?? r);
  const dur = r => {
    const end = r.status === "running" || zero(r.finished) ? Date.now() : new Date(r.finished);
    const s = Math.round((end - new Date(r.started)) / 1000);
    return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min ${s % 60} s` : `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`;
  };
  // outcome mirrors app.Outcome: what a run came to, and its tone.
  const outcome = r => {
    if (r.status === "running") return ["Reviewing", "live"];
    if (r.status === "cancelled") return ["Cancelled", "neutral"];
    if (r.status === "lost") return ["Interrupted", "neutral"];
    if (r.status !== "succeeded") return ["Failed", "bad"];
    const p = r.posted;
    if (!p) return ["Not posted", "neutral"];
    if (p.error) return ["Posting failed", "bad"];
    return {APPROVE: ["Approved", "ok"], REQUEST_CHANGES: ["Changes requested", "changes"], COMMENT: ["Commented", "neutral"]}[p.event] ?? ["Replied", "neutral"];
  };
  // md matches the dashboard's: escape, then `code` and **bold** only.
  const md = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  const chip = (label, tone) => `<span class="chip ${esc(tone)}">${esc(label)}</span>`;
  const runChip = r => chip(...outcome(r));

  const app = document.getElementById("app");
  let status, logs = [];
  const LOG_MAX = 1000;
  // Views by hash: "#logs", "#settings", "#<pr id>", "#run/<pr id>/<run id>" (ids URI-encoded).
  let shown = null; // the run on screen: {pr, run, next, status}

  const route = () => {
    const h = location.hash.slice(1);
    if (h === "logs" || h === "settings") return {view: h};
    if (h.startsWith("run/")) { const [, pr, run] = h.split("/"); return {view: "run", pr: decodeURIComponent(pr), run: decodeURIComponent(run)}; }
    return h ? {view: "pr", pr: decodeURIComponent(h)} : {view: "none"};
  };
  const prHash = id => "#" + encodeURIComponent(id);
  const runHash = (pr, run) => `#run/${encodeURIComponent(pr)}/${encodeURIComponent(run)}`;
  const findRun = (s, pr, run) => s.prs.find(p => p.id === pr)?.review.runs?.find(x => x.id === run);

  async function render() {
    // An update re-renders the same view: keep its open sections and scroll position.
    const r = route(), open = [...document.querySelectorAll("details.fold[open]")].map(d => d.id);
    const top = location.hash === rendered ? document.getElementById("scroll")?.scrollTop ?? 0 : 0;
    rendered = location.hash;
    shown = null;
    if (r.view === "settings") {
      app.innerHTML = header(r.view) + `<div class="settings-page">${await settingsView()}</div>`;
      return;
    }
    const main = r.view === "logs" ? logsView() : r.view === "run" ? await runView(r.pr, r.run)
      : r.view === "pr" ? await detail(r.pr) : overview();
    app.innerHTML = header(r.view) + `<div class="cols">${sidebar(r.pr)}<div id="scroll"><main>${main}</main></div></div>`;
    open.forEach(id => document.getElementById(id)?.setAttribute("open", ""));
    if (r.view === "logs") scrollMain(); else document.getElementById("scroll").scrollTop = top;
  }
  let rendered = null;
  const scrollMain = () => { const m = document.getElementById("scroll"); m.scrollTop = m.scrollHeight; };

  function header(view) {
    const s = status;
    const checked = s.running ? `<span class="checked running">Checking now…</span>`
      : zero(s.last_run) ? `<span class="checked running">Starting…</span>`
      : s.last_error ? `<span class="checked failed">Last check failed ${ago(s.last_run)}</span>`
      : `<span class="checked">Checked ${ago(s.last_run)} · next ${ago(s.next_run)}</span>`;
    const cur = v => view === v ? ` aria-current="page"` : "";
    return `<header class="top"><a class="brand" href="#">waterboy</a>${checked}
      <button id="run" class="btn quiet small" ${s.running ? "disabled" : ""}>Check now</button>
      <nav><a href="#logs"${cur("logs")}>Logs</a><a href="#settings"${cur("settings")}>Settings</a></nav></header>`;
  }

  const GROUPS = [["attention", "Needs you"], ["reviewing", "Reviewing"], ["reviewed", "Reviewed"], ["waiting", "Not reviewed yet"]];
  const inGroup = g => status.prs.filter(p => p.group === g);
  const sidebar = sel => `<aside aria-label="Pull requests">${GROUPS.map(([g, label]) => {
      const prs = inGroup(g);
      return prs.length ? `<h2><span>${label}</span><span>${prs.length}</span></h2>` + prs.map(p => `<a class="pr" href="${prHash(p.id)}"${p.id === sel ? ` aria-current="page"` : ""}>
        <span class="row">${chip(p.verdict, p.tone)}${zero(p.verdict_at) ? "" : ago(p.verdict_at)}</span>
        <span class="title">${esc(p.title)}</span>
        <span class="meta">${base(p.repo)} #${p.number}${p.author ? ` · ${esc(p.author)}` : ""}</span></a>`).join("") : "";
    }).join("") || `<h2>Pull requests</h2><p class="empty">None tracked yet. PRs you're asked to review show up after the next check.</p>`}
    ${status.ignored?.length ? `<h2><span>Untracked</span><span>${status.ignored.length}</span></h2>` + status.ignored.map(i => `<div class="untracked">
      <span title="${esc(i.title)}">${esc(i.repo)}#${i.number}</span><button class="linkbtn" data-action="track" data-pr="${esc(i.repo)}#${i.number}">Track again</button></div>`).join("") : ""}</aside>`;

  const notices = () => (status.runtime_error ? `<p class="notice">Reviews are waiting for the container runtime: ${esc(status.runtime_error)}</p>` : "")
    + (status.budget_wait ? `<p class="notice">${esc(status.budget_wait)}</p>` : "")
    + (status.reviews ? "" : `<p class="notice quiet">Reviews are off. Turn them on in <a href="#settings">Settings</a>.</p>`);

  function overview() {
    const s = status, attn = inGroup("attention"), live = inGroup("reviewing");
    const prLink = p => {
      const r = p.review.runs?.[0];
      return `<a href="${r?.status === "running" ? runHash(p.id, r.id) : prHash(p.id)}">${esc(p.title)}</a>`;
    };
    const row = (p, facts) => `<li>${chip(p.verdict, p.tone)}<span class="grow">${prLink(p)}<span class="facts">${base(p.repo)} #${p.number} · ${facts}</span></span>
      ${zero(p.verdict_at) ? "" : ago(p.verdict_at)}</li>`;
    return `<h1>Overview</h1>
      <section aria-labelledby="needs"><h2 id="needs">Needs you</h2>
        ${s.last_error ? `<p class="notice">The last check failed: ${esc(s.last_error)}</p>` : ""}${notices()}
        ${attn.length ? `<ol class="list card">${attn.map(p => row(p, esc(p.last_error || p.review_note))).join("")}</ol>`
          : !s.last_error && !s.runtime_error && s.reviews ? `<div class="card empty"><div><b>Nothing needs you right now</b>
            <div class="muted">Failed reviews, merge conflicts and container problems show up here.</div></div></div>` : ""}
      </section>
      <section aria-labelledby="now"><h2 id="now">Reviewing now</h2>
        ${live.length ? `<ol class="list card">${live.map(p => row(p, esc(p.review_note)
            + (p.review.runs?.[0]?.overdue ? ` · <span class="err">running longer than the review timeout</span>` : ""))).join("")}</ol>`
          : `<p class="muted">No review running.</p>`}
        ${s.budget_note ? `<p class="muted">${esc(s.budget_note)}</p>` : ""}
      </section>
      <section aria-labelledby="recent"><h2 id="recent">Recent activity</h2>
        ${s.activity?.length ? `<ol class="list card">${s.activity.map(a => `<li>${chip(a.label, a.tone)}
            <span class="grow"><a href="${runHash(a.pr, a.run)}">${esc(a.title)}</a><span class="facts">${esc(a.pr)}${a.detail ? ` · ${esc(a.detail)}` : ""}</span></span>
            ${ago(a.at)}</li>`).join("")}</ol>` : `<p class="muted">No reviews yet.</p>`}
      </section>`;
  }

  // The PR's More menu and "Track again": [UI method, what it removes (asked first)].
  const ACTIONS = {
    reset: ["ResetReviews", "Reset the review status? Stops a running review and forgets the review history; a fresh review is queued. The stack stays."],
    wipe: ["Wipe", "Wipe the review data? Stops a running review, forgets the review history, and removes the stack: containers, network, DB volume, and its images unless something else uses them. The next review starts fresh."],
    untrack: ["Untrack", "Untrack this PR? Wipes its review data and stack, removes the worktree and branch waterboy created, and stops tracking it. It isn't picked up again until you track it again."],
    track: ["Retrack", ""],
  };
  const prMenu = id => `<details class="menu"><summary class="btn quiet">More ▾</summary><div>
      <button data-action="reset" data-pr="${esc(id)}">Reset review status<small>forget history, review again</small></button>
      <button data-action="wipe" data-pr="${esc(id)}">Wipe review data<small>+ stack containers, volumes, images</small></button>
      <button class="danger" data-action="untrack" data-pr="${esc(id)}">Untrack PR<small>+ worktree; ignored until tracked again</small></button>
    </div></details>`;

  async function detail(id) {
    let p;
    try { p = await call("PR", id); } catch (e) { return `<p class="notice">${esc(e.message ?? e)}</p>`; }
    let stack = null, stackErr = "";
    try { stack = await call("Stack", id); } catch (e) { stackErr = e.message ?? String(e); }
    const last = p.review.runs?.[0];
    let body = "";
    if (last) try { body = await call("ReviewText", p.id, last.id); } catch {}
    const list = xs => xs?.length ? xs.map(x => `<code>${esc(x)}</code>`).join(", ") : "none";
    const latest = last ? `<div class="card">
        <div class="card-h">${runChip(last)}${last.posted?.comments ? `<span class="muted">${last.posted.comments} inline comment${last.posted.comments === 1 ? "" : "s"}</span>` : ""}
          <span class="muted">${last.status === "running" ? `started ${ago(last.started)}` : ago(last.finished)}</span>
          ${last.posted?.url ? `<a class="end" href="${esc(last.posted.url)}" data-external>View on GitHub ↗</a>` : ""}</div>
        ${last.error ? `<div class="card-b err">${esc(last.error)}</div>` : ""}
        ${body ? `<div class="card-b"><div class="review-body clamp">${md(body)}</div><a href="${runHash(p.id, last.id)}">Read the full review →</a></div>` : ""}
        <div class="card-f">${p.up_to_date ? `Up to date with <code>${short(p.head_sha)}</code>. The next review starts on new commits or replies.` : esc(p.review_note)}</div></div>`
      : `<div class="card"><div class="card-b muted">${esc(p.review_note)}</div></div>`;
    const runs = p.review.runs?.length ? `<section aria-labelledby="runs"><h2 id="runs">Review runs</h2><div class="card scrollx"><table class="runs">
        <thead><tr><th>Outcome</th><th>Started</th><th>Trigger</th><th class="num">Took</th><th class="num">Turns</th><th class="num">Cost</th><th>Head</th></tr></thead>
        ${p.review.runs.map(r => `<tbody><tr><td>${runChip(r)}</td><td><a href="${runHash(p.id, r.id)}">${stamp(r.started)}</a></td><td>${reason(r.job.reason)}</td>
          <td class="num">${dur(r)}</td><td class="num">${r.claude ? r.claude.num_turns : "—"}</td><td class="num">${r.claude ? "$" + r.claude.cost_usd.toFixed(2) : "—"}</td>
          <td><code>${short(r.job.pr.head_sha)}</code></td></tr>
          ${r.error || r.overdue ? `<tr class="note"><td></td><td colspan="6"><div class="err">${r.overdue ? "Running longer than the review timeout. " : ""}${esc(r.error)}</div></td></tr>` : ""}</tbody>`).join("")}
      </table></div></section>` : "";
    const stackHTML = !stack && !stackErr ? "" : `<details class="fold" id="fold-stack"><summary>Local stack
        ${stack ? `${chip(stack.state, "neutral")}<span class="muted"><code>${esc(stack.project)}</code> · ${stack.containers?.length ?? 0} containers</span>` : ""}
        ${stackErr ? `<span class="err">${esc(stackErr)}</span>` : ""}</summary>
      ${stack ? `<div>${stack.containers?.length ? `<table><thead><tr><th>Service</th><th>Container</th><th>State</th><th>Image</th></tr></thead><tbody>
        ${stack.containers.map(c => `<tr><td>${esc(c.service)}</td><td><code>${esc(c.name)}</code></td><td>${esc(c.status)}</td><td><code>${esc(c.image)}</code></td></tr>`).join("")}
        </tbody></table>` : `<p class="muted">No containers: the next review starts the stack.</p>`}
        <p class="muted">Volumes: ${list(stack.volumes)} · Network: ${list(stack.networks)}</p></div>` : ""}</details>`;
    const health = p.health === "conflict" ? `<p class="notice">Merge conflict at head <code>${short(p.head_sha)}</code>: the on_conflict hook couldn't resolve it. ${esc(p.last_error)}</p>`
      : p.health === "error" ? `<p class="notice">Syncing the worktree failed: ${esc(p.last_error)}</p>` : "";
    return `${notices()}<div class="pagehead"><h1>${esc(p.title)}</h1>
        <div class="meta-line"><span>${esc(p.repo)} #${p.number}</span>${p.author ? `<span>by <a href="https://github.com/${esc(p.author)}" data-external>${esc(p.author)}</a></span>` : ""}
          <code>${esc(p.head_ref)}</code><span>tracked ${ago(p.tracked_at)}</span></div>
        <div class="actions"><button class="btn" data-review="${esc(p.id)}">${p.review.runs?.length ? "Review again" : "Review now"}</button>
          <a class="btn quiet" href="${esc(p.url)}" data-external>Open on GitHub ↗</a>${prMenu(p.id)}<span id="action-msg" class="muted" role="status"></span></div></div>
      ${health}
      <section aria-labelledby="latest"><h2 id="latest">Latest review</h2>${latest}</section>
      ${runs}${stackHTML}
      <details class="fold" id="fold-tracking"><summary>Worktree and tracking <span class="muted">head ${short(p.head_sha)}${p.synced_sha === p.head_sha ? ", synced" : ""}</span></summary>
        <dl><dt>Worktree</dt><dd><code>${esc(p.worktree)}</code></dd><dt>Head</dt><dd><code>${esc(p.head_sha)}</code></dd>
          <dt>Synced</dt><dd><code>${esc(p.synced_sha) || "—"}</code></dd>
          <dt>Created by waterboy</dt><dd>${p.created_worktree ? `worktree${p.created_branch ? " and branch" : ""}; removed when the PR is untracked` : "no, reused an existing worktree"}</dd>
          <dt>Tracked since</dt><dd>${esc(new Date(p.tracked_at).toLocaleString())}</dd><dt>Last activity on GitHub</dt><dd>${zero(p.last_seen_at) ? "never" : esc(new Date(p.last_seen_at).toLocaleString())}</dd></dl></details>`;
  }

  const evHTML = e => {
    const cls = `ev ${esc(e.kind)}${e.is_error ? " bad" : ""}`;
    if (e.kind === "tool") return `<div class="${cls}"><b>${esc(e.tool)}</b><code>${esc(e.text)}</code></div>`;
    if (e.kind === "tool_result") return `<div class="${cls}"><details><summary>${e.is_error ? "error" : "result"}</summary><pre>${esc(e.text)}</pre></details></div>`;
    return `<div class="${cls}">${esc(e.text)}</div>`;
  };

  async function runView(pr, runID) {
    const run = findRun(status, pr, runID), p = status.prs.find(x => x.id === pr);
    if (!run) return `<p class="notice">No run ${esc(runID)} for ${esc(pr)}.</p>`;
    let out, body = "";
    try { out = await call("RunEvents", pr, runID); } catch (e) { return `<p class="notice">${esc(e.message ?? e)}</p>`; }
    try { body = await call("ReviewText", pr, runID); } catch {}
    shown = {pr, run: runID, next: out.next, status: run.status};
    const evs = out.events ?? [], setup = evs.filter(e => e.kind === "output"), c = run.claude, po = run.posted;
    return `${notices()}<nav class="meta-line" aria-label="Breadcrumb"><a href="${prHash(pr)}">${base(p.repo)} #${p.number} ${esc(p.title)}</a></nav>
      <div class="pagehead"><div class="actions"><h1>Review run · ${stamp(run.started)}</h1>${runChip(run)}</div>
        <div class="meta-line"><span>${reason(run.job.reason)} · ${dur(run)}${c ? ` · ${c.num_turns} turns · $${c.cost_usd.toFixed(2)}` : ""}</span>
          <span>head <code>${short(run.job.pr.head_sha)}</code></span>${run.status === "running" ? `<span>container <code>${esc(run.container_name || run.container || "starting…")}</code></span>` : ""}
          ${run.overdue ? `<span class="err">running longer than the review timeout</span>` : ""}</div>
        <div class="meta-line"><button class="linkbtn" data-open="${esc(run.id)}">Open run folder</button></div></div>
      ${run.error ? `<p class="notice">${esc(run.error)}</p>` : ""}${po?.error ? `<p class="notice">Posting to GitHub failed: ${esc(po.error)}</p>` : ""}
      ${body ? `<section class="card" aria-labelledby="written"><div class="card-h"><h2 id="written">${po ? "Posted to GitHub" : "Written, not posted"}</h2>
          ${po ? `<span>${po.comments ? `${po.comments} inline comment${po.comments === 1 ? "" : "s"}` : ""}${po.replies ? ` · ${po.replies} replies` : ""}${po.fallback ? " · as a plain comment (GitHub refused the review)" : ""}</span>
          ${po.url ? `<a class="end" href="${esc(po.url)}" data-external>View on GitHub ↗</a>` : ""}` : ""}</div>
        <div class="card-b review-body">${md(body)}</div></section>` : ""}
      <details class="fold" id="fold-setup"${run.status === "running" ? " open" : ""}><summary>Setup <span class="muted">${setup.length} lines of output${run.stack ? ` · stack <code>${esc(run.stack.project)}</code>` : ""}</span></summary>
        <pre class="setup" id="setup">${setup.map(e => esc(e.text) + "\n").join("")}</pre></details>
      <section class="card" aria-labelledby="transcript"><div class="card-h"><h2 id="transcript">Transcript</h2>
          <div class="filters" role="group" aria-label="Show"><button aria-pressed="true" data-filter="text">Messages</button><button aria-pressed="true" data-filter="tools">Tools</button><button aria-pressed="false" data-filter="other">System events</button></div></div>
        <div class="events no-other" id="events">${evs.filter(e => e.kind !== "output").map(evHTML).join("")}</div></section>`;
  }

  function addRunEvent(e) {
    if (!shown || e.pr !== shown.pr || e.run !== shown.run || e.line < shown.next) return;
    const m = document.getElementById("scroll"), follow = m.scrollTop + m.clientHeight >= m.scrollHeight - 40;
    if (e.kind === "output") { const s = document.getElementById("setup"); s?.append(e.text + "\n"); if (s) s.scrollTop = s.scrollHeight; }
    else document.getElementById("events")?.insertAdjacentHTML("beforeend", evHTML(e));
    if (follow) scrollMain();
  }

  const logRow = e => `<div class="${esc(e.level)}"><span class="muted">${new Date(e.time).toLocaleTimeString([], {hour12: false})}</span> ${esc(e.level)} ${esc(e.msg)} <span class="muted">${esc(e.attrs)}</span></div>`;
  const logsView = () => `<h1>Logs</h1><div class="log card" id="log">${logs.map(logRow).join("")}</div>`;

  function addLog(e) {
    if (logs.length && e.seq <= logs.at(-1).seq) return;
    logs.push(e);
    if (logs.length > LOG_MAX) logs.shift();
    const box = document.getElementById("log");
    if (!box) return;
    const m = document.getElementById("scroll"), follow = m.scrollTop + m.clientHeight >= m.scrollHeight - 20;
    box.insertAdjacentHTML("beforeend", logRow(e));
    if (box.childElementCount > LOG_MAX) box.firstElementChild.remove();
    if (follow) scrollMain();
  }

  async function settingsView() {
    let st;
    try { st = await call("Settings"); } catch (e) { return `<main class="settings"><p class="notice">${esc(e.message ?? e)}</p></main>`; }
    const control = f => {
      const id = `f-${esc(f.key)}`, name = `id="${id}" name="${esc(f.key)}"`;
      if (f.type === "bool") return `<input type="checkbox" ${name}${f.invert ? " data-invert" : ""}${!!f.value !== !!f.invert ? " checked" : ""}>`;
      if (f.options?.length && !f.suggest) return `<select ${name}>${f.options.map(o => `<option${o === f.value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      if (f.type === "number") return `<input type="number" step="any" ${name} value="${esc(f.value)}">`;
      return `<input ${name} value="${esc(f.value)}"${f.options?.length ? ` list="o-${esc(f.key)}"` : ""}>`
        + (f.options?.length ? `<datalist id="o-${esc(f.key)}">${f.options.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : "");
    };
    const fields = fs => fs.map(f => `<div class="field"><label for="f-${esc(f.key)}"><b>${esc(f.label)}</b><span class="muted">${esc(f.help)}</span><small>${esc(f.key)}</small></label>
      <span class="control">${control(f)}</span></div>`).join("");
    const groups = [...new Set(st.fields.map(f => f.group))];
    return `<main class="settings"><div class="pagehead"><h1>Settings</h1>
        <div class="muted">Saved to <code>${esc(st.path)}</code>. Changes apply after a restart; repos, hooks and env stay in the file.</div></div>
      <form id="settings">${groups.map(g => {
        const fs = st.fields.filter(f => f.group === g);
        return g === "Advanced" ? `<details class="fold" id="fold-advanced"><summary>Advanced <span class="muted">${fs.map(f => esc(f.label)).join(", ")}</span></summary>${fields(fs)}</details>`
          : `<section class="card" aria-labelledby="g-${esc(g)}"><div class="card-h"><h2 id="g-${esc(g)}">${esc(g)}</h2></div>${fields(fs)}</section>`;
      }).join("")}</form></main>
      <div class="savebar" id="savebar" role="region" aria-label="Unsaved changes" hidden><span id="msg" role="status"></span>
        <button type="button" class="btn quiet" id="discard">Discard</button><button type="submit" class="btn" id="save" form="settings">Save</button>
        <button type="button" class="btn" id="restart" hidden>Restart waterboy</button></div>`;
  }

  // Settings: mark what changed and say how much; only changed fields are saved, so defaults aren't pinned into the file.
  const changed = form => [...form.elements].filter(el => el.name && (el.type === "checkbox" ? el.checked !== el.defaultChecked
    : el.tagName === "SELECT" ? !el.selectedOptions[0]?.defaultSelected : el.value !== el.defaultValue));
  const showBar = (text, saved) => {
    document.getElementById("msg").textContent = text;
    document.getElementById("savebar").hidden = !text;
    document.getElementById("save").hidden = document.getElementById("discard").hidden = saved;
    document.getElementById("restart").hidden = !saved;
  };
  const refreshBar = form => {
    const c = changed(form);
    form.querySelectorAll(".field").forEach(f => f.classList.toggle("dirty", c.some(el => f.contains(el))));
    showBar(c.length ? `${c.length} unsaved change${c.length > 1 ? "s" : ""}` : "", false);
  };
  async function saveSettings(form) {
    const c = changed(form);
    const values = Object.fromEntries(c.map(el => [el.name,
      el.type === "checkbox" ? el.checked !== el.hasAttribute("data-invert") : el.type === "number" ? Number(el.value) : el.value]));
    try { await call("SaveSettings", values); } catch (e) { return (document.getElementById("msg").textContent = e.message ?? e); }
    c.forEach(el => el.type === "checkbox" ? el.defaultChecked = el.checked
      : el.tagName === "SELECT" ? [...el.options].forEach(o => o.defaultSelected = o.selected) : el.defaultValue = el.value);
    form.querySelectorAll(".dirty").forEach(f => f.classList.remove("dirty"));
    showBar("Saved. Restart waterboy to apply.", true);
  }

  app.addEventListener("click", e => {
    if (e.target.id === "run") return call("RunNow");
    const act = e.target.closest("[data-action]");
    if (act) {
      const {action, pr} = act.dataset, [method, ask] = ACTIONS[action];
      if (ask && !confirm(`${pr}: ${ask}`)) return;
      act.disabled = true;
      act.closest(".menu")?.removeAttribute("open");
      const msg = document.getElementById("action-msg");
      if (msg) Object.assign(msg, {textContent: `${action}…`, className: "muted"});
      return call(method, pr).then(() => { if (action === "untrack") location.hash = ""; render(); }, err => {
        if (msg) Object.assign(msg, {textContent: err.message ?? err, className: "err"}); else alert(err.message ?? err);
        act.disabled = false;
      });
    }
    if (e.target.dataset.review) {
      e.target.disabled = true;
      return call("ReviewNow", e.target.dataset.review).catch(err => {
        Object.assign(document.getElementById("action-msg"), {textContent: err.message ?? err, className: "err"});
        e.target.disabled = false;
      });
    }
    const f = e.target.closest("[data-filter]");
    if (f) {
      const on = f.getAttribute("aria-pressed") !== "true";
      f.setAttribute("aria-pressed", on);
      return document.getElementById("events").classList.toggle("no-" + f.dataset.filter, !on);
    }
    if (e.target.id === "discard") { const form = document.getElementById("settings"); form.reset(); return refreshBar(form); }
    if (e.target.id === "restart") { showBar("Restarting… reopen the window from the menu bar.", true); return call("Restart"); }
    if (e.target.dataset.open) return call("OpenRun", route().pr, e.target.dataset.open);
    const a = e.target.closest("a[data-external]");
    if (a) { e.preventDefault(); return Browser.OpenURL(a.href); }
  });
  app.addEventListener("submit", e => { e.preventDefault(); saveSettings(e.target); });
  app.addEventListener("input", e => { if (e.target.form?.id === "settings") refreshBar(e.target.form); });
  app.addEventListener("change", e => { if (e.target.form?.id === "settings") refreshBar(e.target.form); });
  addEventListener("hashchange", render);
  Events.On("status", e => {
    status = e.data;
    const r = route();
    if (r.view === "logs" || r.view === "settings") return; // settings: don't wipe a form being edited
    // Not while a menu is open; the next update renders instead.
    if (document.querySelector(".menu[open]")) return;
    // A run view only re-renders when that run's state changes; otherwise it would
    // lose its scroll position on every update.
    if (r.view === "run" && shown && findRun(status, r.pr, r.run)?.status === shown.status
        && !findRun(status, r.pr, r.run)?.overdue) return;
    render();
  });
  Events.On("log", e => addLog(e.data));
  Events.On("run-event", e => addRunEvent(e.data));
  const backlog = await call("Logs"); // merge: events may have arrived while this was in flight
  const live = logs;
  logs = backlog;
  live.forEach(addLog);
  status = await call("Status");
  render();
</script>
</head>
<body><div id="app"></div></body>
</html>
