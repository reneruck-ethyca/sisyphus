<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>waterboy</title>
<style>
  :root { color-scheme: light dark; --bg: #faf9f5; --side: #f0eee6; --fg: #3d3929; --muted: #83827d; --line: #e3dfd2; --hover: #e8e5da;
          --accent: #c15f3c; --ok: #4f7a3a; --pending: #5b6f8a; --error: #a8661a; --conflict: #b3403a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262624; --side: #1f1e1d; --fg: #f0eee6; --muted: #a6a39a; --line: #3e3d39; --hover: #30302e;
            --accent: #d97757; --ok: #8fb573; --pending: #9db3cf; --error: #e0a458; --conflict: #e5847b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  #app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(220px, 300px) 1fr; height: 100vh; }
  #app > header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; background: var(--side); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; color: var(--accent); }
  h2 { font-size: 16px; margin: 0 0 6px; }
  h3 { font-size: 14px; margin: 24px 0 8px; }
  aside { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; }
  aside .pr { padding: 8px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; cursor: pointer; }
  aside .pr:hover { background: var(--hover); }
  aside .pr.sel { background: var(--hover); border-left-color: var(--accent); }
  aside .row { display: flex; gap: 6px; align-items: center; }
  aside .row :last-child { margin-left: auto; }
  aside .title { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.error { background: var(--error); } .dot.conflict { background: var(--conflict); }
  #main { padding: 16px 20px; overflow-y: auto; min-width: 0; }
  .muted { color: var(--muted); }
  .err { color: var(--conflict); margin: 0 0 12px; }
  button { font: inherit; padding: 3px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #run { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .health { font-weight: 600; }
  .ok { color: var(--ok); } .pending { color: var(--pending); } .error { color: var(--error); } .conflict { color: var(--conflict); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
  a { color: var(--accent); }
  #log { font: 12px/1.6 ui-monospace, monospace; }
  #log div { white-space: pre-wrap; word-break: break-all; border-bottom: 1px solid var(--line); }
  .WARN { color: var(--error); } .ERROR { color: var(--conflict); }
  .running, .queued { color: var(--pending); } .succeeded { color: var(--ok); }
  .failed, .timeout, .lost { color: var(--conflict); } .cancelled { color: var(--muted); }
  pre { font: 12px/1.5 ui-monospace, monospace; background: var(--side); padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  button.link { margin: 0; padding: 0; border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .runhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .runhead h3 { margin: 24px 0 4px; }
  .overdue { color: var(--error); }
  .reviewing { display: flex; gap: 10px; flex-wrap: wrap; }
  .reviewing a.active { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 10px; background: var(--hover);
    color: var(--fg); text-decoration: none; font: 12px ui-monospace, monospace; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); animation: pulse 1.4s ease-in-out infinite; }
  .active.overdue .pulse { background: var(--error); }
  @keyframes pulse { 50% { opacity: .25; } }
  #events { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
  .ev { white-space: pre-wrap; word-break: break-word; }
  .ev.output, .ev.init, .ev.system { font: 12px/1.5 ui-monospace, monospace; color: var(--muted); }
  .ev.text { padding: 8px 10px; background: var(--side); border-radius: 6px; border-left: 3px solid var(--accent); }
  .ev.tool b { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .ev.tool code { font: 12px ui-monospace, monospace; }
  .ev.tool_result details { margin-left: 14px; font-size: 12px; }
  .ev.tool_result summary { color: var(--muted); cursor: pointer; }
  .ev.tool_result pre { max-height: 360px; overflow: auto; }
  .ev.bad, .ev.bad summary { color: var(--conflict); }
  .ev.result { font-weight: 600; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  #settings label { display: grid; grid-template-columns: 190px 220px 1fr; gap: 4px 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  #settings input:not([type=checkbox]) { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  #settings input[type=checkbox] { justify-self: start; }
  #settings code { font: 12px ui-monospace, monospace; }
  .actions { display: flex; gap: 10px; align-items: center; } .actions button { flex: none; }
</style>
<script type="module">
  import { Call, Events, Browser } from "/wails/runtime.js";

  const call = (m, ...a) => Call.ByName("main.UI." + m, ...a);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  const since = t => { const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m${s % 60}s` : `${Math.floor(s / 3600)}h${Math.floor(s % 3600 / 60)}m`; };
  const time = t => !t || t.startsWith("0001") ? "never" : new Date(t).toLocaleString();
  const app = document.getElementById("app");
  let status, logs = [];
  const LOG_MAX = 1000;
  // Views by hash: "#logs", "#settings", "#<pr id>", "#run/<pr id>/<run id>" (ids URI-encoded).
  let shown = null; // the run on screen: {pr, run, next, status}

  const route = () => {
    const h = location.hash.slice(1);
    if (h === "logs" || h === "settings") return {view: h};
    if (h.startsWith("run/")) { const [, pr, run] = h.split("/"); return {view: "run", pr: decodeURIComponent(pr), run: decodeURIComponent(run)}; }
    return h ? {view: "pr", pr: decodeURIComponent(h)} : {view: "none"};
  };
  const runHash = (pr, run) => `#run/${encodeURIComponent(pr)}/${encodeURIComponent(run)}`;

  async function render() {
    const r = route();
    shown = null;
    const main = r.view === "logs" ? logsView() : r.view === "settings" ? await settingsView() : r.view === "run" ? await runView(r.pr, r.run)
      : r.view === "pr" ? await detail(r.pr) : placeholder();
    app.innerHTML = header() + sidebar(r.pr) + `<section id="main">${notices()}${main}</section>`;
    if (r.view === "logs" || r.view === "run") scrollMain();
  }

  const findRun = (s, pr, run) => s.prs.find(p => p.id === pr)?.review.runs?.find(x => x.id === run);

  const evHTML = e => {
    const cls = `ev ${esc(e.kind)}${e.is_error ? " bad" : ""}`;
    if (e.kind === "tool") return `<div class="${cls}"><b>${esc(e.tool)}</b><code>${esc(e.text)}</code></div>`;
    if (e.kind === "tool_result") return `<div class="${cls}"><details><summary>${e.is_error ? "error" : "result"}</summary><pre>${esc(e.text)}</pre></details></div>`;
    return `<div class="${cls}">${esc(e.text)}</div>`;
  };

  async function runView(pr, runID) {
    const run = findRun(status, pr, runID);
    if (!run) return `<p class="err">No run ${esc(runID)} for ${esc(pr)}.</p>`;
    let out;
    try { out = await call("RunEvents", pr, runID); } catch (e) { return `<p class="err">${esc(e.message ?? e)}</p>`; }
    shown = {pr, run: runID, next: out.next, status: run.status};
    const c = run.claude;
    return `<h2><a href="#${encodeURIComponent(pr)}">${esc(pr)}</a></h2>
      <div class="runhead"><h3>Run ${esc(run.id)}</h3><span class="${esc(run.status)}">${esc(run.status)}</span>
        ${run.overdue ? `<span class="overdue">⚠ running longer than review.timeout</span>` : ""}
        <button class="link" data-open="${esc(run.id)}">folder</button></div>
      <div class="muted">${esc(run.job.reason)} · head ${esc(run.job.pr.head_sha.slice(0, 12))} · started ${time(run.started)}
        ${c ? ` · ${c.num_turns} turns · $${c.cost_usd.toFixed(2)}` : ""}</div>
      ${run.error ? `<p class="err">${esc(run.error)}</p>` : ""}
      ${run.posted ? `<p>Posted ${run.posted.event ? `<b>${esc(run.posted.event)}</b>` : "replies"}${run.posted.comments ? ` · ${run.posted.comments} inline` : ""}${run.posted.replies ? ` · ${run.posted.replies} replies` : ""}${run.posted.fallback ? " · as a plain comment (GitHub refused the review)" : ""}${run.posted.url ? ` · <a href="${esc(run.posted.url)}" data-external>view on GitHub ↗</a>` : ""}</p>` : ""}
      <div id="events">${(out.events ?? []).map(evHTML).join("")}</div>`;
  }

  function addRunEvent(e) {
    if (!shown || e.pr !== shown.pr || e.run !== shown.run || e.line < shown.next) return;
    const box = document.getElementById("events");
    if (!box) return;
    const m = document.getElementById("main"), follow = m.scrollTop + m.clientHeight >= m.scrollHeight - 40;
    box.insertAdjacentHTML("beforeend", evHTML(e));
    if (follow) scrollMain();
  }

  const scrollMain = () => { const m = document.getElementById("main"); m.scrollTop = m.scrollHeight; };

  function header() {
    const s = status;
    return `<header><h1>waterboy</h1>
        <span class="muted">${esc(s.user)} · ${esc(s.org)} · every ${esc(s.interval)} ·
        ${s.running ? "running…" : "last run " + time(s.last_run)}</span>
        <span class="reviewing">${(s.reviewing ?? []).map(a => `<a class="active${a.overdue ? " overdue" : ""}" href="${runHash(a.pr, a.run)}"
          title="container ${esc(a.container || "starting")}"><span class="pulse"></span>${esc(a.pr)} · ${esc(a.container_name || a.container.slice(0, 12) || "starting…")}
          · ${since(a.started)}${a.overdue ? " ⚠" : ""}</a>`).join("") || `<span class="muted">no review running</span>`}</span>
        <button id="run" ${s.running ? "disabled" : ""}>Run now</button><a href="#logs">Logs</a><a href="#settings">Settings</a></header>`;
  }

  const sidebar = sel => `<aside>${status.prs.map(p => `<div class="pr${p.id === sel ? " sel" : ""}" data-id="${esc(p.id)}">
      <div class="row"><span class="dot ${esc(p.health)}" title="${esc(p.health)}"></span><strong>${esc(p.id)}</strong>${reviewCell(p.review)}</div>
      <div class="title" title="${esc(p.title)}">${esc(p.title)}</div></div>`).join("")
    || `<p class="muted" style="padding: 0 12px">No PRs tracked.</p>`}</aside>`;

  const notices = () => {
    const s = status;
    return (s.last_error ? `<p class="err">${esc(s.last_error)}</p>` : "")
      + (s.reviews ? "" : `<p class="muted">Reviews are disabled (review.disabled).</p>`)
      + (s.runtime_error ? `<p class="err">Reviews are waiting for the container runtime: ${esc(s.runtime_error)}</p>` : "");
  };

  const placeholder = () => status.prs.length ? `<p class="muted">Select a PR on the left.</p>` : "";

  const reviewCell = r => r.state ? `<span class="${esc(r.state)}">${esc(r.state)}</span>`
    : r.runs?.length ? `<span class="${esc(r.runs[0].status)}">${esc(r.runs[0].status)}</span>` : `<span class="muted">—</span>`;

  const logRow = e => `<div class="${esc(e.level)}"><span class="muted">${new Date(e.time).toLocaleTimeString([], {hour12: false})}</span> ${esc(e.level)} ${esc(e.msg)} <span class="muted">${esc(e.attrs)}</span></div>`;

  function logsView() {
    return `<h2>Logs</h2><div id="log">${logs.map(logRow).join("")}</div>`;
  }

  function addLog(e) {
    if (logs.length && e.seq <= logs.at(-1).seq) return;
    logs.push(e);
    if (logs.length > LOG_MAX) logs.shift();
    const box = document.getElementById("log");
    if (!box) return;
    const m = document.getElementById("main"), follow = m.scrollTop + m.clientHeight >= m.scrollHeight - 20;
    box.insertAdjacentHTML("beforeend", logRow(e));
    if (box.childElementCount > LOG_MAX) box.firstElementChild.remove();
    if (follow) scrollMain();
  }

  async function settingsView() {
    let st;
    try { st = await call("Settings"); } catch (e) { return `<p class="err">${esc(e.message ?? e)}</p>`; }
    const input = f => f.type === "bool" ? `<input type="checkbox" name="${esc(f.key)}"${f.value ? " checked" : ""}>`
      : `<input${f.type === "number" ? ` type="number" step="any"` : ""} name="${esc(f.key)}" value="${esc(f.value)}">`;
    return `<h2>Settings</h2><p class="muted">${esc(st.path)} · saved settings apply after a restart. Repos, hooks and env stay in the file.</p>
      <form id="settings">${st.fields.map(f => `<label><code>${esc(f.key)}</code>${input(f)}<span class="muted">${esc(f.help)}</span></label>`).join("")}
      <p class="actions"><button>Save</button><button type="button" id="restart">Restart waterboy</button><span id="msg"></span></p></form>`;
  }

  const say = (text, cls) => Object.assign(document.getElementById("msg"), {textContent: text, className: cls});

  async function saveSettings(form) {
    // Only changed fields, so defaults aren't pinned into the file.
    const changed = [...form.elements].filter(el => el.name && (el.type === "checkbox" ? el.checked !== el.defaultChecked : el.value !== el.defaultValue));
    if (!changed.length) return say("Nothing changed.", "muted");
    const values = Object.fromEntries(changed.map(el => [el.name, el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value]));
    try { await call("SaveSettings", values); } catch (e) { return say(e.message ?? e, "err"); }
    changed.forEach(el => el.type === "checkbox" ? el.defaultChecked = el.checked : el.defaultValue = el.value);
    say("Saved. Restart to apply.", "ok");
  }

  async function detail(id) {
    let p;
    try { p = await call("PR", id); } catch (e) { return `<p class="err">${esc(e.message ?? e)}</p>`; }
    const field = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
    return `<h2>${esc(p.title)} <span class="health ${p.health}">${p.health}</span></h2>
      ${p.last_error ? `<p class="err">${esc(p.last_error)}</p>` : ""}
      <dl>${[
        field("PR", `<a href="${esc(p.url)}" data-external>${esc(p.id)}</a>`),
        field("Branch", esc(p.head_ref)),
        field("Head", esc(p.head_sha)),
        field("Synced", esc(p.synced_sha) || "—"),
        field("Worktree", esc(p.worktree) + (p.created_worktree ? "" : " <span class=muted>(reused)</span>")),
        field("Tracked since", time(p.tracked_at)),
        field("Last seen", time(p.last_seen_at)),
      ].join("")}</dl>
      <h3>Reviews ${p.review.state ? `<span class="${esc(p.review.state)}">${esc(p.review.state)}</span>` : ""}</h3>
      ${p.review.runs?.length ? `<table><thead><tr><th>Run</th><th>Reason</th><th>Head</th><th>Status</th><th>Started</th><th>Claude</th></tr></thead><tbody>
        ${p.review.runs.map(r => `<tr>
          <td><a href="${runHash(p.id, r.id)}">${esc(r.id)}</a>${r.overdue ? ` <span class="overdue" title="running longer than review.timeout">⚠</span>` : ""}</td>
          <td>${esc(r.job.reason)}</td><td class="muted">${esc(r.job.pr.head_sha.slice(0, 12))}</td>
          <td class="${esc(r.status)}">${esc(r.status)}${r.error ? `<div class="err">${esc(r.error)}</div>` : ""}</td>
          <td class="muted">${time(r.started)}</td>
          <td class="muted">${r.claude ? `${r.claude.num_turns} turns · $${r.claude.cost_usd.toFixed(2)}` : ""}</td></tr>`).join("")}
        </tbody></table>` : `<p class="muted">No reviews yet.</p>`}`;
  }

  app.addEventListener("click", e => {
    if (e.target.id === "run") return call("RunNow");
    if (e.target.id === "restart") { say("Restarting… reopen the window from the menu bar.", "muted"); return call("Restart"); }
    if (e.target.dataset.open) return call("OpenRun", route().pr, e.target.dataset.open);
    const a = e.target.closest("a[data-external]");
    if (a) { e.preventDefault(); return Browser.OpenURL(a.href); }
    const row = e.target.closest("[data-id]");
    if (row) location.hash = encodeURIComponent(row.dataset.id);
  });
  app.addEventListener("submit", e => { e.preventDefault(); saveSettings(e.target); });
  addEventListener("hashchange", render);
  Events.On("status", e => {
    status = e.data;
    const r = route();
    if (r.view === "logs" || r.view === "settings") return; // settings: don't wipe a form being edited
    // A run view only re-renders when that run's state changes; otherwise it would
    // lose its scroll position on every update.
    if (r.view === "run" && shown && findRun(status, r.pr, r.run)?.status === shown.status
        && !findRun(status, r.pr, r.run)?.overdue) return;
    render();
  });
  Events.On("log", e => addLog(e.data));
  Events.On("run-event", e => addRunEvent(e.data));
  const backlog = await call("Logs"); // merge: events may have arrived while this was in flight
  const live = logs;
  logs = backlog;
  live.forEach(addLog);
  status = await call("Status");
  render();
</script>
</head>
<body><div id="app"></div></body>
</html>
