name: CI

on:
  push:
    branches: [main]

jobs:
  ci:
    # Wails links against Cocoa via cgo, so build and test need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
